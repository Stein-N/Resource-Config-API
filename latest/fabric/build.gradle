plugins {
    id 'loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    testmodImplementation project(':latest:common').sourceSets.testmod.output

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api}+${minecraft_version}"

    modCompileOnly("com.terraformersmc:modmenu:${mod_menu}")
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) accessWidenerPath.set(aw)

    runs {
        client {
            client()
            source sourceSets.testmod
            setConfigName("Fabric Test Client")
            ideConfigGenerated(true)
            programArgs('--username', 'Dev')
            runDir("runs/client")
        }
    }
}

processTestmodResources {
    from file('../common/src/testmod/resources')
}

publishMods {
    file = remapJar.archiveFile
    modLoaders.addAll("fabric", "quilt")
}