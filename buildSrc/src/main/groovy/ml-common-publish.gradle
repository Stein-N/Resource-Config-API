plugins {
    id 'maven-publish'
}

publishing {
    def mavenDirectory = MAVEN_REPOSITORY
    def artifact = mod_id + "-" + project.name

    publications {
        mavenJava(MavenPublication) {
            artifactId = artifact
            from components.java

            pom.withXml {
                asNode().dependencies.each { node ->
                    node.replaceNode {}
                }
            }
        }
    }

    repositories {
        maven { url = mavenDirectory }
    }

    publish.doLast {
        exec {
            workingDir mavenDirectory
            commandLine 'cmd', '/c', 'git add . && git commit -m "' + "${mod_id}-${project.name}-${version}" + '" && git push'
        }
    }
}