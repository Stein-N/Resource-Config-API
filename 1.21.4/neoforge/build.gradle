compileTestmodJava {
    source(project(':1.21.4:common').sourceSets.testmod.allSource)
}

processTestmodResources {
    from file('../common/src/testmod/resources')
}

publishMods {
    file = jar.archiveFile
    modLoaders.addAll("neoforge")

    modrinth {
        minecraftVersions.addAll("1.21.4")
    }
    curseforge {
        minecraftVersions.addAll("1.21.4")
    }
}