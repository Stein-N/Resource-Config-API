plugins {
    id 'ml-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    testmodImplementation sourceSets.main.output

    testmodImplementation project(':1.21.4:common').sourceSets.testmod.output
}

neoForge {
    version = neoforge_21_4

    def at = file('../common/src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) accessTransformers = [at]

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_21_4
    }

