pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.neoforged.net/releases/' }
        maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Resource-Config-API'
include('latest');
include('stable');

rootProject.children.each { subproject ->
    def subprojectDir = file(subproject.projectDir)
    subprojectDir.eachDir { dir ->
        if (subproject.projectDir.getName() == "latest" && dir.getName() == "forge") {
            return;
        }
        if (new File(dir, 'build.gradle').exists()) {
            include "${subproject.name}:${dir.name}"
        }
    }
}